<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 · 霓虹版 NEON 2048</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>2048</text></svg>">
<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1424; --panel:#121a2e; --line:#1c2a47;
  --cyan:#00e5ff; --green:#00ff9d; --pink:#ff2e97; --orange:#ff9f43;
  --purple:#a855f7; --yellow:#ffd60a; --txt:#e8f1ff; --dim:#7c8db5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#10203a 0%,var(--bg) 55%,#05070f 100%);
  color:var(--txt);overflow:hidden;user-select:none;
}
.bg-grid{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:42px 42px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%)}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.32;pointer-events:none}
.glow-a{width:420px;height:420px;background:#00e5ff;top:-140px;left:-120px;animation:drift 15s ease-in-out infinite}
.glow-b{width:380px;height:380px;background:#ff2e97;bottom:-160px;right:-120px;animation:drift 19s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:14px 14px 10px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.logo{display:flex;align-items:center;gap:10px}
.logo .icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 0 22px rgba(0,229,255,.4)}
.logo .icon svg{width:22px;height:22px}
.logo h1{font-size:19px;letter-spacing:2px;font-weight:800}
.logo h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:10px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.stats{display:flex;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:66px}
.stat b{display:block;font-size:17px;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:var(--dim);letter-spacing:1px}
.stat.best b{color:var(--green)}
/* 舞台 */
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.board-wrap{position:relative;width:100%;max-width:min(100%,72vh);aspect-ratio:1/1;max-height:100%;
  border-radius:18px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);
  box-shadow:0 0 40px rgba(0,229,255,.08),inset 0 0 60px rgba(0,0,0,.55);padding:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;height:100%;width:100%}
.cell{position:relative;background:rgba(28,42,71,.35);border-radius:10px;overflow:hidden}
.tile{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-variant-numeric:tabular-nums;transition:transform .12s ease,background .15s,box-shadow .15s;z-index:2}
.tile .val{transition:transform .12s ease}
.tile.pop{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tile-2{background:linear-gradient(135deg,#2a3a5e,#1f2c47);color:#aebfe0;box-shadow:inset 0 0 14px rgba(0,229,255,.12)}
.tile-4{background:linear-gradient(135deg,#31456e,#243450);color:#c0d2f0;box-shadow:inset 0 0 14px rgba(0,229,255,.2)}
.tile-8{background:linear-gradient(135deg,#0e7f8f,#0b5f6e);color:#eaffff;box-shadow:0 0 14px rgba(0,229,255,.35)}
.tile-16{background:linear-gradient(135deg,#00b8cc,#0090a8);color:#04121a;box-shadow:0 0 18px rgba(0,229,255,.5)}
.tile-32{background:linear-gradient(135deg,#b83280,#8b2a63);color:#ffe9f4;box-shadow:0 0 18px rgba(255,46,151,.5)}
.tile-64{background:linear-gradient(135deg,#ff2e97,#d31f75);color:#fff;box-shadow:0 0 22px rgba(255,46,151,.65)}
.tile-128{background:linear-gradient(135deg,#ff9f43,#f57f1a);color:#221005;box-shadow:0 0 26px rgba(255,159,67,.7);font-size:.86em}
.tile-256{background:linear-gradient(135deg,#ffd60a,#f0b800);color:#221803;box-shadow:0 0 30px rgba(255,214,10,.75);font-size:.78em}
.tile-512{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 0 34px rgba(168,85,247,.8);font-size:.7em}
.tile-1024{background:linear-gradient(135deg,#ff2e97,#a855f7);color:#fff;box-shadow:0 0 40px rgba(255,46,151,.85);font-size:.62em}
.tile-2048{background:linear-gradient(135deg,#00ff9d,#00e5ff);color:#04121a;box-shadow:0 0 48px rgba(0,255,157,.9);font-size:.56em;animation:rainbow 2s linear infinite}
@keyframes rainbow{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(30deg)}}
.tile-super{background:linear-gradient(135deg,#fff,#cfd8ff);color:#0a0e1a;box-shadow:0 0 60px rgba(255,255,255,.8);font-size:.5em}
/* 浮层 */
.overlay{position:absolute;inset:0;background:rgba(6,10,22,.8);backdrop-filter:blur(6px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:9;transition:opacity .3s;border-radius:18px}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay h2{font-size:28px;letter-spacing:4px;font-weight:900}
.overlay h2 em{font-style:normal;color:var(--green);text-shadow:0 0 24px rgba(0,255,157,.8)}
.overlay .sub{color:var(--dim);font-size:13px;letter-spacing:1px;text-align:center;line-height:1.8}
.overlay .score-big{font-size:40px;font-weight:900;color:var(--cyan);text-shadow:0 0 30px rgba(0,229,255,.7);font-variant-numeric:tabular-nums}
.overlay .score-big small{font-size:13px;color:var(--dim);display:block;letter-spacing:2px;margin-bottom:2px}
.btn{font-family:inherit;font-size:15px;font-weight:700;letter-spacing:2px;color:#04121a;
  background:linear-gradient(135deg,var(--cyan),var(--purple));border:none;border-radius:12px;padding:12px 34px;cursor:pointer;
  box-shadow:0 0 24px rgba(0,229,255,.4);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.kbd-hint{color:var(--dim);font-size:11px;letter-spacing:1px}
/* 控制 */
.controls{padding:12px 2px 2px;display:flex;flex-direction:column;gap:10px}
.dpad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:0 auto;width:100%}
.dpad button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--cyan);font-size:20px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s;min-height:44px}
.dpad button:active{transform:translateY(3px);box-shadow:none}
.dpad button.up{grid-column:2}.dpad button.left{grid-column:1;grid-row:2}
.dpad button.down{grid-column:2;grid-row:2}.dpad button.right{grid-column:3;grid-row:2}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .hint{color:var(--dim);font-size:11px;letter-spacing:1px}
.bar .tools{display:flex;gap:8px}
.mini-btn{font-family:inherit;font-size:12px;letter-spacing:1px;color:var(--txt);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:8px 16px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.mini-btn:active{transform:scale(.95)}
.mini-btn.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,229,255,.3)}
@media (pointer:coarse),(max-width:560px){
  .dpad{display:grid}.bar .hint{display:none}
  header .logo h1{font-size:16px}
  .grid{gap:8px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<div class="wrap">
  <header>
    <div class="logo">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0e1a" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
      <div>
        <h1>2048 <em>霓虹版</em></h1>
        <small>NEON 2048 · 2026</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>得分</span></div>
      <div class="stat best"><b id="best">0</b><span>最高</span></div>
      <div class="stat"><b id="moves">0</b><span>步数</span></div>
    </div>
  </header>

  <div class="stage">
    <div class="board-wrap">
      <div class="grid" id="grid"></div>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">2048 <em>NEON</em></h2>
        <div class="sub" id="ov-sub">方向键 / WASD / 滑动屏幕<br>合并相同数字，向 2048 进发</div>
        <div class="score-big" id="ov-score" style="display:none"><small>本局得分</small><span id="ov-score-num">0</span></div>
        <button class="btn" id="start-btn">开始游戏</button>
        <div class="kbd-hint">↑ ↓ ← → · WASD · 滑动</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad" id="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
    <div class="bar">
      <span class="hint">方向键/WASD 移动 · 滑动屏幕 · R 重开 · Z 撤销</span>
      <div class="tools">
        <button class="mini-btn" id="undo-btn">撤销</button>
        <button class="mini-btn" id="restart-btn">重开</button>
        <button class="mini-btn" id="sound-btn">音效 开</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const SIZE=4;
let grid, score, best, moves, alive, started, wonShown, soundOn;
let history=[]; // 撤销历史
let lastSpawn=null; // 新生成方块位置（用于弹出动画）
soundOn = localStorage.getItem('neon_2048_sound')!=='0';
best = parseInt(localStorage.getItem('neon_2048_best')||'0',10)||0;
document.getElementById('best').textContent = best;

const gridEl = document.getElementById('grid');
// 初始化 16 个格子
for(let i=0;i<SIZE*SIZE;i++){
  const c=document.createElement('div');
  c.className='cell'; c.id='cell-'+i;
  gridEl.appendChild(c);
}

/* ---- 音效 ---- */
let actx=null;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function tone(f,d,type,v,slide){
  if(!soundOn) return;
  const a=ac(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square'; o.frequency.value=f;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
  g.gain.setValueAtTime(v||.05,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);
}
const sndMove=()=>tone(200,.04,'triangle',.03);
const sndMerge=(n)=>{ const f=400+Math.min(n,2048)*0.15; tone(f,.09,'triangle',.06); setTimeout(()=>tone(f*1.4,.1,'triangle',.05),60); };
const sndSpawn=()=>tone(300,.05,'square',.04);
const sndWin=()=>{ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.14,'triangle',.07),i*110)); };
const sndLose=()=>{ tone(280,.35,'sawtooth',.08,90); setTimeout(()=>tone(160,.4,'sawtooth',.07,60),200); };

/* ---- 逻辑 ---- */
function emptyGrid(){ return Array.from({length:SIZE},()=>new Array(SIZE).fill(0)); }
function reset(){
  grid=emptyGrid(); score=0; moves=0; wonShown=false;
  history=[];
  addTile(); addTile();
  alive=true; started=true;
  updateHUD(); render();
  hideOverlay();
}
function addTile(){
  const free=[];
  for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++) if(!grid[y][x]) free.push({x,y});
  if(!free.length) return;
  const p=free[Math.floor(Math.random()*free.length)];
  grid[p.y][p.x]=Math.random()<.9?2:4;
  lastSpawn=p;
  sndSpawn();
}
function clone(g){ return g.map(r=>r.slice()); }
function compress(row){
  // 左移并合并，返回 [新行, 得分增量, 是否移动]
  const cells=row.filter(v=>v);
  let added=0, moved=false;
  for(let i=0;i<cells.length-1;i++){
    if(cells[i]===cells[i+1]){
      cells[i]*=2; added+=cells[i]; cells.splice(i+1,1); moved=true;
    }
  }
  while(cells.length<SIZE) cells.push(0);
  moved = moved || !row.every((v,i)=>v===cells[i]);
  return [cells,added,moved];
}
function slide(dir){
  // dir: 0上 1右 2下 3左
  const before=clone(grid);
  let added=0, anyMove=false;
  const g=emptyGrid();
  for(let i=0;i<SIZE;i++){
    let col=[];
    for(let j=0;j<SIZE;j++){
      let v;
      if(dir===0) v=grid[j][i];
      else if(dir===1) v=grid[i][SIZE-1-j];
      else if(dir===2) v=grid[SIZE-1-j][i];
      else v=grid[i][j];
      col.push(v);
    }
    const [res,add,mv]=compress(col);
    added+=add; anyMove=anyMove||mv;
    for(let j=0;j<SIZE;j++){
      let x,y;
      if(dir===0){ x=i; y=j; }
      else if(dir===1){ x=SIZE-1-j; y=i; }
      else if(dir===2){ x=i; y=SIZE-1-j; }
      else { x=j; y=i; }
      g[y][x]=res[j];
    }
  }
  if(anyMove){
    history.push({grid:before,score});
    if(history.length>30) history.shift();
    grid=g; score+=added; moves++;
    sndMove();
    if(added>0) sndMerge(Math.max(added,4));
    addTile();
    updateHUD(); render();
    checkEnd();
  }
}
function checkEnd(){
  // 胜利
  if(!wonShown){
    for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++){
      if(grid[y][x]>=2048){
        wonShown=true; sndWin();
        showOverlay('YOU WIN!','你已经合成 2048！继续挑战更高分', true);
        return;
      }
    }
  }
  // 是否还有空位或可合并
  for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++){
    if(!grid[y][x]) return;
    if(x<SIZE-1&&grid[y][x]===grid[y][x+1]) return;
    if(y<SIZE-1&&grid[y][x]===grid[y+1][x]) return;
  }
  alive=false;
  if(score>best){ best=score; localStorage.setItem('neon_2048_best',String(best)); document.getElementById('best').textContent=best; }
  sndLose();
  showOverlay('GAME OVER','没有可合并的方块了…', true);
}
function undo(){
  if(!history.length) return;
  const h=history.pop();
  grid=h.grid; score=h.score;
  if(moves>0) moves--;
  updateHUD(); render();
}
/* ---- 渲染 ---- */
function render(){
  for(let i=0;i<SIZE*SIZE;i++){
    const cell=document.getElementById('cell-'+i);
    // 移除旧 tile
    const old=cell.querySelector('.tile');
    if(old) old.remove();
    const y=Math.floor(i/SIZE), x=i%SIZE;
    const v=grid[y][x];
    if(!v) continue;
    const t=document.createElement('div');
    t.className='tile tile-'+ (v<=2048?v:'super');
    const span=document.createElement('span');
    span.className='val'; span.textContent=v;
    t.appendChild(span);
    if(lastSpawn && lastSpawn.x===x && lastSpawn.y===y){
      t.classList.add('pop');
      lastSpawn=null;
    }
    cell.appendChild(t);
  }
}
function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('moves').textContent=moves;
}
/* ---- UI ---- */
const overlay=document.getElementById('overlay');
function showOverlay(title,sub,showScore){
  document.getElementById('ov-title').innerHTML = title.replace(' ',' <em>') + (title.includes(' ')?'</em>':'');
  document.getElementById('ov-sub').innerHTML = sub;
  const s=document.getElementById('ov-score');
  s.style.display=showScore?'block':'none';
  if(showScore) document.getElementById('ov-score-num').textContent=score;
  overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }
document.getElementById('start-btn').addEventListener('click', reset);
document.getElementById('restart-btn').addEventListener('click', ()=>{ if(started) reset(); });
document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('sound-btn').addEventListener('click', function(){
  soundOn=!soundOn;
  localStorage.setItem('neon_2048_sound', soundOn?'1':'0');
  this.textContent='音效 '+(soundOn?'开':'关');
  this.classList.toggle('on', !soundOn);
});
/* 键盘 */
const keyMap={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
document.addEventListener('keydown', e=>{
  if(e.code in keyMap){
    e.preventDefault();
    if(started&&alive) slide(keyMap[e.code]);
  }else if(e.code==='KeyR'){
    e.preventDefault(); if(started) reset();
  }else if(e.code==='KeyZ'){
    e.preventDefault(); if(started&&alive) undo();
  }
});
/* 触屏方向键 */
document.querySelectorAll('#dpad button').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(started&&alive) slide({up:0,right:1,down:2,left:3}[b.dataset.dir]);
  });
});
/* 触屏滑动 */
let tx=0,ty=0;
const boardWrap=document.querySelector('.board-wrap');
boardWrap.addEventListener('touchstart',e=>{ const t=e.touches[0]; tx=t.clientX; ty=t.clientY; },{passive:true});
boardWrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!started||!alive) return;
  const t=e.touches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) slide(dx>0?1:3);
  else slide(dy>0?2:0);
  tx=t.clientX; ty=t.clientY;
},{passive:false});

/* 初始化展示 */
grid=emptyGrid();
render();
showOverlay('2048 NEON','方向键 / WASD / 滑动屏幕<br>合并相同数字，向 2048 进发', false);
})();
</script>
</body>
</html>
